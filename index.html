<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap Responsive Gallery</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container py-5">
    <div class="text-center mb-4">
      <h1 class="fw-bold">Responsive Image Gallery</h1>
      <p class="text-secondary mb-0">
        Mobile: 1 ảnh • Tablet: 2 ảnh • Desktop: 4 ảnh
      </p>
    </div>

    <div class="row g-4">
      <div class="col-12 col-sm-6 col-lg-3">
        <div class="card h-100 shadow-sm gallery-card">
          <img src="images/nature-1.svg" class="card-img-top img-fluid" alt="Khung cảnh núi">
          <div class="card-body">
            <h2 class="h5 card-title">Mountain</h2>
            <p class="card-text text-secondary">Khung cảnh thiên nhiên yên bình.</p>
          </div>
        </div>
      </div>

      <div class="col-12 col-sm-6 col-lg-3">
        <div class="card h-100 shadow-sm gallery-card">
          <img src="images/nature-2.svg" class="card-img-top img-fluid" alt="Hoàng hôn">
          <div class="card-body">
            <h2 class="h5 card-title">Sunset</h2>
            <p class="card-text text-secondary">Hoàng hôn với sắc màu ấm áp.</p>
          </div>
        </div>
      </div>

      <div class="col-12 col-sm-6 col-lg-3">
        <div class="card h-100 shadow-sm gallery-card">
          <img src="images/nature-3.svg" class="card-img-top img-fluid" alt="Biển xanh">
          <div class="card-body">
            <h2 class="h5 card-title">Ocean</h2>
            <p class="card-text text-secondary">Không gian biển xanh rộng lớn.</p>
          </div>
        </div>
      </div>

      <div class="col-12 col-sm-6 col-lg-3">
        <div class="card h-100 shadow-sm gallery-card">
          <img src="images/nature-4.svg" class="card-img-top img-fluid" alt="Khu rừng">
          <div class="card-body">
            <h2 class="h5 card-title">Forest</h2>
            <p class="card-text text-secondary">Khu rừng xanh mát và trong lành.</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
